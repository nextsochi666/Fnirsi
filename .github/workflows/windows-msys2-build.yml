name: Windows MSYS2 build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-glibmm
            mingw-w64-ucrt-x86_64-doxygen

      - name: Show environment
        run: |
          echo "MSYSTEM=$MSYSTEM"
          uname -a
          gcc --version
          cmake --version
          pkg-config --modversion glibmm-2.4 || true
          pkg-config --modversion libsigrokcxx || true

      - name: Configure libsigrok C++ bindings
        run: |
          if [ -f ./configure ]; then
            ./configure --enable-cxx
          elif [ -f ./autogen.sh ]; then
            ./autogen.sh
            ./configure --enable-cxx
          else
            echo "No libsigrok configure script found"
            exit 1
          fi

      - name: Build libsigrok
        run: |
          make -j$(nproc)

      - name: Install libsigrok
        run: |
          make install

      - name: Configure dependent project
        env:
          PKG_CONFIG_PATH: /ucrt64/lib/pkgconfig:/ucrt64/share/pkgconfig
        run: |
          cmake -S . -B build -G "MinGW Makefiles" \
            -DCMAKE_PREFIX_PATH=/ucrt64 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

name: Build sigrok + PulseView (Windows/MSYS2)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            tar
            unzip
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-glibmm
            mingw-w64-ucrt-x86_64-doxygen
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-svg

      - name: Show tool versions
        run: |
          echo "MSYSTEM=$MSYSTEM"
          uname -a
          gcc --version
          cmake --version
          pkg-config --modversion glibmm-2.4 || true

      - name: Clone sigrok repos
        shell: bash
        run: |
          git clone --depth 1 https://github.com/sigrokproject/libsigrok.git /tmp/libsigrok
          git clone --depth 1 https://github.com/sigrokproject/libsigrokdecode.git /tmp/libsigrokdecode
          git clone --depth 1 https://github.com/sigrokproject/pulseview.git /tmp/pulseview

      - name: Build and install libsigrok
        run: |
          cd /tmp/libsigrok
          ./autogen.sh
          ./configure --enable-cxx --prefix=/ucrt64
          make -j$(nproc)
          make install

      - name: Build and install libsigrokdecode
        run: |
          cd /tmp/libsigrokdecode
          ./autogen.sh
          ./configure --prefix=/ucrt64
          make -j$(nproc)
          make install

      - name: Build PulseView
        run: |
          cd /tmp/pulseview
          cmake -S . -B build \
            -G "MinGW Makefiles" \
            -DCMAKE_PREFIX_PATH=/ucrt64 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
